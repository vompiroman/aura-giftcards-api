name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_e2e:
        description: Require the isolated payment test environment
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-secrets.mjs
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node --test scripts/test-secret-check.mjs

  integration:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @workspace/api-server test:integration
      - name: Verify partner transactions in PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/aura-partner-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.16
          PGLITE_ENTRY="$RUNNER_TEMP/aura-partner-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-partner-database.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    env:
      REQUIRE_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.require_e2e }}
      API_BASE: ${{ secrets.E2E_API_BASE }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
      TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      ITEM_NAME: "Netflix 1 mois"
      ITEM_SERVICE: "Netflix"
    steps:
      - name: Check E2E configuration
        id: e2e_config
        shell: bash
        run: |
          required=(API_BASE SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY WEBHOOK_SECRET TEST_EMAIL TEST_PASSWORD)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Payment E2E tests were skipped because the staging environment is incomplete" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing configuration names: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE_E2E" = "true" ]; then
              echo "::error::The required payment E2E environment is incomplete."
              exit 1
            fi
            echo "::warning::Payment E2E tests did not run."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.e2e_config.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.e2e_config.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.e2e_config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.e2e_config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.e2e_config.outputs.enabled == 'true'
        run: pnpm --filter @workspace/api-server test:e2e:ci
